<h1>Even Odds</h1>
<p>A fair dice roller for board games. Every possible roll goes into a shuffled stack and is dealt one at a time, so your results follow the true bell curve.</p>
<h2>Support</h2>
<p>Questions, bug reports or feedback? Please open an issue on <a href="https://github.com/EdwardClementLee/even-odds-support/issues">GitHub</a>.</p>
